<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Expedientes · Prueba de conexión</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --azul: #1F3864; --verde: #2E7D5B; --rojo: #B3261E; --gris: #5F6368; --fondo: #F4F6FA; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--fondo); color: #1D1D1D; }
  header { background: var(--azul); color: #fff; padding: 18px 24px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .5px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  .tarjeta { background: #fff; border-radius: 10px; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { margin: 0 0 12px; font-size: 15px; color: var(--azul); text-transform: uppercase; letter-spacing: .5px; }
  .paso { display: flex; gap: 10px; align-items: baseline; margin: 6px 0; font-size: 14px; }
  .paso b { min-width: 18px; }
  .ok { color: var(--verde); } .error { color: var(--rojo); } .espera { color: var(--gris); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #E3E6EC; }
  th { color: var(--gris); font-weight: normal; font-size: 12px; text-transform: uppercase; }
  button { background: #fff; border: 1px solid var(--azul); color: var(--azul); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  pre { background: #F1F3F4; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  .oculto { display: none; }
</style>
</head>
<body>

<header>
  <h1>FACTOR GFC GLOBAL · PORTAL DE EXPEDIENTES</h1>
  <p>Prueba de conexión: Google → API → matriz</p>
</header>

<main>
  <div class="tarjeta">
    <h2>1. Entrar</h2>
    <div id="botonGoogle"></div>
    <div id="avisoInvitacion" class="paso espera oculto"></div>
  </div>

  <div class="tarjeta">
    <h2>2. Verificación</h2>
    <div id="pasos"></div>
  </div>

  <div id="tarjetaPerfil" class="tarjeta oculto">
    <h2>3. Tu sesión</h2>
    <div id="perfil"></div>
    <p><button onclick="cerrarSesion()">Cerrar sesión</button></p>
  </div>

  <div id="tarjetaCreditos" class="tarjeta oculto">
    <h2>4. Créditos que puedes ver</h2>
    <div id="creditos"></div>
  </div>

  <div id="tarjetaError" class="tarjeta oculto">
    <h2>Detalle técnico</h2>
    <pre id="detalle"></pre>
  </div>
</main>

<script>
  // ============================================================
  // LLENA ESTOS DOS VALORES
  // ============================================================
  const API_URL = 'https://script.google.com/macros/s/AKfycbykPG-PWoe_1Bfed4rL764v4s4-_J5ALDyq2IT6XiowRJQW9esnxSjjlUQbqjweJmWr/exec';
  const GOOGLE_CLIENT_ID = '702092251446-cqnovl2e9v36focccm1kvk1oe105d7tv.apps.googleusercontent.com';
  // ============================================================

  let sesion = null;
  const codigoInvitacion = new URLSearchParams(location.search).get('inv');

  // Llamada única a la API: siempre POST con texto JSON.
  // (Sin encabezado Content-Type a propósito: así el navegador no hace
  //  una consulta previa que Apps Script no sabe contestar.)
  async function api(accion, datos) {
    const resp = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ accion: accion, datos: datos || {}, sesion: sesion })
    });
    return resp.json();
  }

  function paso(texto, clase) {
    const d = document.createElement('div');
    d.className = 'paso ' + clase;
    d.innerHTML = '<b>' + (clase === 'ok' ? '✓' : clase === 'error' ? '✗' : '…') + '</b><span></span>';
    d.querySelector('span').textContent = texto;
    document.getElementById('pasos').appendChild(d);
    return d;
  }

  function mostrarError(titulo, r) {
    paso(titulo + ': ' + (r && r.mensaje ? r.mensaje : 'sin respuesta'), 'error');
    document.getElementById('tarjetaError').classList.remove('oculto');
    document.getElementById('detalle').textContent = JSON.stringify(r, null, 2);
  }

  function escapar(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---------- 1. Google entrega el comprobante ----------
  async function alEntrarConGoogle(respuesta) {
    document.getElementById('pasos').innerHTML = '';
    paso('Google confirmó tu identidad', 'ok');

    // ---------- 2. La API lo verifica y abre sesión ----------
    const espera = paso('Verificando con la API…', 'espera');
    let r;
    try {
      r = await api('iniciarSesion', { idToken: respuesta.credential });
    } catch (e) {
      espera.remove();
      return mostrarError('No se pudo contactar la API (revisa API_URL y que la implementación sea "Cualquier usuario")', { mensaje: String(e) });
    }
    espera.remove();
    if (!r.ok) return mostrarError('La API rechazó el inicio de sesión', r);

    sesion = r.datos.sesion;
    const u = r.datos.usuario;
    paso('Sesión abierta como ' + u.email + ' (' + u.rol + ')', 'ok');

    document.getElementById('tarjetaPerfil').classList.remove('oculto');
    document.getElementById('perfil').innerHTML =
      '<div class="paso"><b></b><span><strong>' + escapar(u.nombre || u.email) + '</strong></span></div>' +
      '<div class="paso"><b></b><span>' + escapar(u.email) + ' · rol: ' + escapar(u.rol) + '</span></div>';

    // ---------- 3. Si vino con invitación, canjearla ----------
    if (codigoInvitacion) {
      if (u.rol !== 'Cliente') {
        paso('La liga de invitación es para clientes; como personal interno no se canjea.', 'espera');
      } else {
        const c = await api('canjearInvitacion', { codigo: codigoInvitacion });
        if (c.ok) {
          paso('Invitación canjeada: acceso concedido', 'ok');
          history.replaceState(null, '', location.pathname);   // quita el código de la barra
        } else {
          mostrarError('No se pudo canjear la invitación', c);
        }
      }
    }

    // ---------- 4. Leer créditos reales de la matriz ----------
    const m = await api('misCreditos');
    if (!m.ok) return mostrarError('No se pudieron leer los créditos', m);
    paso('La API leyó la matriz: ' + m.datos.length + ' crédito(s) visibles', 'ok');

    document.getElementById('tarjetaCreditos').classList.remove('oculto');
    document.getElementById('creditos').innerHTML = m.datos.length
      ? '<table><tr><th>Crédito</th><th>Cliente</th><th>Nombre</th><th>Estado</th></tr>' +
        m.datos.map(c => '<tr><td>' + escapar(c.idCredito) + '</td><td>' + escapar(c.cliente) +
          '</td><td>' + escapar(c.nombre) + '</td><td>' + escapar(c.estado) + '</td></tr>').join('') + '</table>'
      : '<p class="espera">No tienes créditos visibles todavía.' +
        (u.rol === 'Cliente' ? ' Abre la liga de invitación que te envió Factor GFC.' : ' La matriz aún no tiene créditos dados de alta.') + '</p>';
  }

  async function cerrarSesion() {
    if (sesion) await api('cerrarSesion');
    sesion = null;
    google.accounts.id.disableAutoSelect();
    location.reload();
  }

  // ---------- arranque ----------
  window.onload = function () {
    if (API_URL.indexOf('PEGAR') === 0 || GOOGLE_CLIENT_ID.indexOf('PEGAR') === 0) {
      return mostrarError('Configuración incompleta', { mensaje: 'Llena API_URL y GOOGLE_CLIENT_ID al inicio del archivo.' });
    }
    if (codigoInvitacion) {
      const a = document.getElementById('avisoInvitacion');
      a.textContent = 'Abriste una liga de invitación. Entra con la cuenta de Google a la que se te envió.';
      a.classList.remove('oculto');
    }
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: alEntrarConGoogle });
    google.accounts.id.renderButton(document.getElementById('botonGoogle'),
      { theme: 'outline', size: 'large', text: 'signin_with', locale: 'es' });
  };
</script>
</body>
</html>
